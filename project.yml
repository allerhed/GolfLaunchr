name: GolfLaunchr
options:
  bundleIdPrefix: com.allerhed
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6S7W5L2V33
    CODE_SIGN_STYLE: Automatic
packages:
  Domain: { path: Packages/Domain }
  Analytics: { path: Packages/Analytics }
  Persistence: { path: Packages/Persistence }
  Formatting: { path: Packages/Formatting }
  Capture: { path: Packages/Capture }
targets:
  GolfLaunchr:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Domain
      - package: Analytics
      - package: Persistence
      - package: Formatting
      - package: Capture
      - package: Capture
        product: CaptureAV
      # PersistenceTestSupport (in-memory fake) is deliberately NOT linked into the app.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GolfLaunchr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleLocalizations: [en, sv]
        NSCameraUsageDescription: Camera is used to detect and measure your golf shots.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allerhed.golflaunchr
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug-only capture harness (G1). Release must contain none of it: scripts/check-harness-separation.sh.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CAPTURE_HARNESS"
  GolfLaunchrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/Unit]
    dependencies:
      - { target: GolfLaunchr }
      - { package: Persistence, product: PersistenceTestSupport }
    settings:
      base: { GENERATE_INFOPLIST_FILE: YES }
  GolfLaunchrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    dependencies: [{ target: GolfLaunchr }]
    settings:
      base: { GENERATE_INFOPLIST_FILE: YES }
schemes:
  GolfLaunchr:
    build: { targets: { GolfLaunchr: all } }
    test:
      targets: [GolfLaunchrTests, GolfLaunchrUITests]
